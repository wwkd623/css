<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>addClass(),removeClass(),toggleClass()</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <style>
        .text_red{
            color: red;
        }
    </style>
</head>
<body>
    <button class="btn1">글자색 변경</button>
    <button class="btn2">글자색 제거</button>
    <button class="btn3">토글클래스</button>
    <p>안녕하세요</p>
    <script>
        $(function(){
            $(".btn1").click(function(){
                // Class()는 애초에 class 함수기 때문에 별명앞에 .을 기입하지 않음
                $("p").addClass("text_red")
            })
            $(".btn2").click(function(){
                $("p").removeClass("text_red")
            })
            $(".btn3").click(function(){
                $("p").toggleClass("text_red")
            })
        })
    </script>
</body>
</html>

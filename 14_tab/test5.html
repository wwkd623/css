<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>switch문 활용</title>
    <style>
        *{margin: 0; padding: 0; box-sizing: border-box;}
        li{list-style: none;}
        a{text-decoration: none;}
        ul{
            width: 760px;
            /* border: 1px solid red; */
            margin: auto;
            display: flex;
            gap: 10px;
        }
        ul li{
            width: 100px;
            height: 100px;   
            border: 1px solid #000;
        }
        ul li a{
            display: block;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #555;
            font-size: 24px;
            font-weight: bold;
        }
    </style>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>
<body>
    <ul>
        <li><a href="#">빨</a></li>
        <li><a href="#">주</a></li>
        <li><a href="#">노</a></li>
        <li><a href="#">초</a></li>
        <li><a href="#">파</a></li>
        <li><a href="#">남</a></li>
        <li><a href="#">보</a></li>
    </ul>
    <script>
        $(function(){
            $("ul li").click(function(){
                let num = $(this).index();
                let change = "";
                switch(num){
                    case 0:
                        change = $(this).css({"background": "red"}).animate({"margin-top": 400}).animate({"margin-top": 0},function(){
                        $(this).css({"background": "#fff"})
                    })
                    break;
                    case 1:
                        change = $(this).css({"background": "orange"}).animate({"margin-top": 400}).animate({"margin-top": 0},function(){
                        $(this).css({"background": "#fff"})
                    })
                    break;
                    case 2:
                        change = $(this).css({"background": "yellow"}).animate({"margin-top": 400}).animate({"margin-top": 0},function(){
                        $(this).css({"background": "#fff"})
                    })
                    break;
                    case 3:
                        change = $(this).css({"background": "green"}).animate({"margin-top": 400}).animate({"margin-top": 0},function(){
                        $(this).css({"background": "#fff"})
                    })
                    break;
                    case 4:
                        change = $(this).css({"background": "blue"}).animate({"margin-top": 400}).animate({"margin-top": 0},function(){
                        $(this).css({"background": "#fff"})
                    })
                    break;
                    case 5:
                        change = $(this).css({"background": "navy"}).animate({"margin-top": 400}).animate({"margin-top": 0},function(){
                        $(this).css({"background": "#fff"})
                    })
                    break;
                    default:
                        change = $(this).css({"background": "purple"}).animate({"margin-top": 400}).animate({"margin-top": 0},function(){
                        $(this).css({"background": "#fff"})
                    })
                }
            })
        })
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kiosk</title>
</head>
<body>
    <h1>음료를 주문하세요</h1>
    <button data-name="아메리카노" data-price="3000">아메리카노</button>
    <button data-name="카페라떼" data-price="4000">카페라떼</button>
    <button data-name="바닐라라떼" data-price="4500">바닐라라떼</button>
    <button data-name="카라멜마끼아또" data-price="5000">카라멜마끼아또</button>
    <button data-name="자몽에이드" data-price="4500">자몽에이드</button>
    <button data-name="청포도에이드" data-price="4500">청포도에이드</button>
    <hr>
    <h1>주문내역</h1>
    <p>메뉴명: <span id="name"></span></p>
    <p>가격: <span id="price"></span></p>
    <p>제품을 주문하셨습니다.</p>

    <script>
        let menu = document.getElementsByTagName("button");
        let name = document.getElementById("name");
        console.log(name)
        let price = document.getElementById("price");
        console.log(price)

        for(let i=0; i<menu.length; i++){
            menu[i].addEventListener("click",function(){
                let cname = this.dataset.name;
                let cprice = this.dataset.price;

                name.innerHTML = cname;
                price.innerHTML = cprice;
            })
        }
    </script>
</body>
</html>

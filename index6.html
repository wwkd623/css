<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>화살표함수 응용문제</title>
</head>
<body>
    <script>
        let song = ["1절","<br>2절","<br>3절","<br>4절"];
        let corus = ()=>document.write(`무궁화 삼천리 화려 강산<br>대한 사람 대한으로 길이 보전하세<br>`);

        let fst = (`동해물과 백두산이 마르고 닳도록<br>하느님이 보우하사 우리나라 만세`);
        let sec = (`남산 위에 저 소나무 철갑을 두른 듯<br>바람 서리 불변함은 우리 기상일세`);
        let thr = (`가을 하늘 공활한데 높고 구름 없이<br>밝은 달은 우리 가슴 일편단심일세`);
        let fth = (`이 기상과 이 맘으로 충성을 다하여<br>괴로우나 즐거우나 나라 사랑하세`);

        document.write(song[0] + "<br>");
        document.write(fst + "<br>");
        corus();

        document.write(song[1] + "<br>");
        document.write(sec + "<br>");
        corus();

        document.write(song[2] + "<br>");
        document.write(thr + "<br>");
        corus();

        document.write(song[3] + "<br>");
        document.write(fth + "<br>");
        corus();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>배열</title>
</head>
<body>
    <!-- 
        배열 > 여러개의 값을 한꺼번에 저장할 수 있는 저장공간. 이것과 대비되는 것이 하나의 값만 기억하는 변수
    -->
    <script>
        // 여러개의 데이터를 한꺼번에 저장하려면 반드시 배열로 선언해야한다.
        let fru = "딸기";
        let fruit = ["사과", "바나나", "포도"];

        // 배열의 순서(index색인) > 맨 앞 데이터가 0번째.
        document.write(fru + "<br>");
        document.write(fruit[0] + "<br>");
        document.write(fruit[1] + "<br>");
        document.write(fruit[2] + "<br>");
        document.write(fruit + "<br>");
    </script>
</body>
</html>

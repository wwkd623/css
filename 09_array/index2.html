<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>배열</title>
</head>
<body>
    <script>
        let fruit = ["바나나", "포도", "수박"];
        document.write("올해의 제철 과일은 " + fruit + "입니다. <br>");
        document.write("오늘의 추천 과일은 " + fruit[2] + "입니다. <br>");
        let day = ["월", "화", "수", "목", "금", "토", "일"];
        document.write("<h2>일주일 요일</h2>");
        document.write("오늘은 " + day[0] + "요일 입니다.<br>");
        document.write(day[0] + "요일<br>");
        document.write(day[1] + "요일<br>");
        document.write(day[2] + "요일<br>");
        document.write(day[3] + "요일<br>");
        document.write(day[4] + "요일<br>");
        document.write(day[5] + "요일<br>");
        document.write(day[6] + "요일<br>");
        document.write("<hr>");
        for(let i=0; i<=6; i++){
            document.write(day[i] + "요일<br>");
        }

        let gg = ["태연", "윤아", "티파니", "수영", "효연", "서현", "써니", "유리"];
        document.write("소녀시대의 멤버는 " + gg[0] + "입니다.<br>");
        document.write("소녀시대의 멤버는 " + gg[1] + "입니다.<br>");
        document.write("소녀시대의 멤버는 " + gg[2] + "입니다.<br>");
        document.write("소녀시대의 멤버는 " + gg[3] + "입니다.<br>");
        document.write("소녀시대의 멤버는 " + gg[4] + "입니다.<br>");
        document.write("소녀시대의 멤버는 " + gg[5] + "입니다.<br>");
        document.write("소녀시대의 멤버는 " + gg[6] + "입니다.<br>");
        document.write("소녀시대의 멤버는 " + gg[7] + "입니다.<br>");
        document.write("<hr>");
        
    </script>
</body>
</html>

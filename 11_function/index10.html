<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>계산기</title>
</head>
<body>
    <script>
        let number1 = prompt("숫자를 입력하세요.");
        let number2 = prompt("더할 숫자를 입력하세요.");
        function add(num1,num2){
            return Number(num1) + Number(num2);
        }

        document.write(`${number1}+${number2}=${add(number1,number2)}`)
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>함수매개변수 응용문제</title>
</head>
<body>
    <script>
        function city(name,count){
            for(let i=1;i<=count;i++){
                document.write(`여기는 ${name}입니다<br>`);
            }
        }
        city("서울",5);
        city("부산",4);
        city("제주",3);
    </script>
</body>
</html>

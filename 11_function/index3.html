<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>함수(익명함수)</title>
</head>
<body>
    <!-- 익명함수 > 함수의 이름이 없는 함수 -->
    <script>
        // 익명함수 선언
        let hi = function(){
            alert("안녕!!!");
        }

        // 이름이 없으니까 변수에 넣어서 사용한다. ex) let 변수이름 = function(){}
        // 함수 실행하려면 함수 이름을 호출해야함, 이름이 없기 때문에 변수명+(); 여기서 ()이게 함수임
        hi();

        // 익명함수를 어떨 때 사용하는가 > 잠깐 사용할때(1회성), 다른 함수에 값을 전달할 때
    </script>
</body>
</html>

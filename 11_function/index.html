<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>함수(function)</title>
</head>
<body>
    <!-- 
        코딩에서의 함수는 디자인의 컴포넌트와 비슷함.
    -->
        <script>
            // 함수로 선언
            // function 함수이름(){
            //      할 일을 코딩;
            // }
            function hi(){
                alert("안녕하세요!")
            }

            // 함수를 실행하려면 함수명을 호출해야함
            hi();
            hi();
        </script>
</body>
</html>

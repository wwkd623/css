<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>함수예제3</title>
</head>
<body>
    <script>
        let amount = 3650000;
        function interestCalculator(amount,term,rate){
            let result = amount * term * rate / 100;
            return result;
        }
        document.write(`맡긴 금액은 ${amount}원 입니다<br>`)
        document.write(`이자는 ${interestCalculator(3650000,1,4)}원 입니다.<br>`) 
        document.write(`최종 받을 금액은 ${amount + interestCalculator(3650000,1,4)}원 입니다.`) 
    </script>
</body>
</html>

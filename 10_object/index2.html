<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자바스크립트 객체데이터</title>
</head>
<body>
    <script>
        let schdule = {
            mon: {
                class1: "html",
                class2: "css"
            },
            tus: {
                class1: "javascript",
                class2: "jquery"
            },
            wedns: {
                class1: "작품집",
                class2: "포트폴리오"
            }
        };
        document.write("<h3>월요일</h3>")
        document.write("1교시: " + schdule.mon.class1 + "<br>");
        document.write("2교시: " + schdule.mon.class2 + "<br>");
        document.write("<br>")
        document.write("<h3>화요일</h3>")
        document.write("1교시: " + schdule.tus.class1 + "<br>");
        document.write("2교시: " + schdule.tus.class2 + "<br>");
        document.write("<br>")
        document.write("<h3>수요일</h3>")
        document.write("1교시: " + schdule.wedns.class1 + "<br>");
        document.write("2교시: " + schdule.wedns.class2 + "<br>");

        for(let key in schdule){
            document.write("<h3>" + key + "day</h3>");
            for(let time in schdule[key]){
                document.write(time + ": " + schdule[key][time] + "<br>");
            }
        };
    </script>
</body>
</html>

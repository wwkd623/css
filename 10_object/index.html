<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자바스크립트 객체데이터</title>
</head>
<body>
    <!-- 
        객체(object) > 어떤 것에 대한 정보들을 보아놓은 저장공간
        예시) 강아지 객체
        이름, 나이, 종, 색
    -->
    <script>
        // 객체 데이터를 선언하는 법
        let dog = {
            name: "초코",
            age: 3,
            color: "갈색"
        };
        // 객체데이터를 출력할 때
        document.write(dog.name + "<br>");
        document.write(dog.age + "<br>");
        document.write(dog.color + "<br>");
        document.write(dog);
        console.log(dog);
        document.write("<hr>");
        // 배열로 출력할 때
        let dog2 = ["초코", 3, "갈색"];
        document.write(dog2[0] + "<br>");
        document.write(dog2[1] + "<br>");
        document.write(dog2[2] + "<br>");
        document.write(dog2 + "<br>");
    </script>
    <!-- 
        객체 > key(index)와 값(value) 쌍으로 담는다
            1. 객체이름.키이름 으로 저장된 데이터를 꺼내올 수 있다.
            2. 객체이름["키이름"]
    -->
    <hr>
    <script>
        let friend = {
            name: "홍길동",
            age: 20,
            hobby: "운동",
            favorite: "수학"
        };
        console.log(friend);
        document.write(friend.name + "<br>");
        document.write(friend["name"] + "<br>");

        document.write("<hr>");
        
        // 객체 안에 또 다른 객체
        let school = {
            name: "KD초등학교",
            location: {
                city: "서울",
                street: "종로구 123"
            },
            class: 16
        };
        document.write(school.name + "<br>");
        document.write(school.location.city + "<br>");
        document.write(school.location.street + "<br>");
        
        document.write("<hr>");

        let zoo = {
            lion: {
                name: "킹",
                age: 5,
                charactor: "갈기가 멋져요"
            },
            gire: {
                name: "길쭉이",
                age: 3,
                charactor: "목이 길어요"
            },
            panda: {
                name: "통통이",
                age: 4,
                charactor: "대나무를 좋아해요"
            }
        };
        document.write(zoo["lion"]["name"] + "<br>");
        document.write(zoo.lion.name + "<br>");

        document.write("<hr>");

        let schdule = {
            mon: {
                class1: "1교시: html",
                class2: "2교시: css"
            },
            tus: {
                class1: "1교시: javascript",
                class2: "2교시: jquery"
            },
            wed: {
                class1: "1교시: 작품집",
                class2: "2교시: 포트폴리오"
            }
        };
        document.write("<h3>월요일</h3>")
        document.write(schdule.mon.class1 + "<br>");
        document.write(schdule.mon.class2 + "<br>");
        document.write("<br>")
        document.write("<h3>화요일</h3>")
        document.write(schdule.tus.class1 + "<br>");
        document.write(schdule.tus.class2 + "<br>");
        document.write("<br>")
        document.write("<h3>수요일</h3>")
        document.write(schdule.wed.class1 + "<br>");
        document.write(schdule.wed.class2 + "<br>");
    </script>
</body>
</html>

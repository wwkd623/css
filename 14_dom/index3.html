<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM객체선택3</title>
</head>
<body>
    <h1 class="tit1">큰제목1</h1>
    <h1 class="tit2">큰제목2</h1>
    <h1 class="tit3">큰제목3</h1>

    <script>
        let tit1 = document.getElementsByClassName("tit1");
        console.log(tit1);
        tit1[0].style.color = "red";

        let tit2 = document.getElementsByClassName("tit2");
        console.log(tit2);
        tit2[0].style.color = "green";

        let tit3 = document.getElementsByClassName("tit3");
        console.log(tit3);
        tit3[0].style.color = "blue";
    </script>
</body>
</html>
